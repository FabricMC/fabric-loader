repositories {
	maven {
		name = 'Mojang'
		url = 'https://libraries.minecraft.net/'
	}
}

dependencies {
	api project(":")

	// log4j wrapper
	compileOnly 'org.apache.logging.log4j:log4j-api:2.8.1'
	// slf4j wrapper
	compileOnly 'org.slf4j:slf4j-api:1.8.0-beta4'

	// launchwrapper + dependencies
	compileOnly ('net.minecraft:launchwrapper:1.12') {
		transitive = false
	}
	//implementation 'net.sf.jopt-simple:jopt-simple:5.0.3'

	// Unit testing for semver
	implementation project(":").sourceSets.main.output
	testImplementation('org.junit.jupiter:junit-jupiter:5.9.2')
	testImplementation('org.mockito:mockito-core:5.20.0')
	testRuntimeOnly('org.junit.platform:junit-platform-launcher')
	testImplementation('com.google.code.gson:gson:2.2.4')
	testImplementation('net.fabricmc:mapping-io:0.9.1')
}

sourceSets {
	main {
		java.srcDirs = ['src/main/java', 'src/main/legacyJava']
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"

	if (JavaVersion.current().isJava9Compatible()) {
		it.options.release = 8
	}
}

jar {
	enabled = false
}

test {
	useJUnitPlatform()
}

tasks.register('menuClientCheck', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'net.fabricmc.loader.impl.game.minecraft.patch.MenuClientCheck'
	def clients = providers.gradleProperty('menuClients')
	def allClients = providers.gradleProperty('menuAll').map { Boolean.parseBoolean(it) }.orElse(false)

	doFirst {
		if (!clients.isPresent()) throw new GradleException('Pass -PmenuClients=<client class directory>')
		args clients.get()
		if (allClients.get()) args '--all'
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}
